# Daily database backup. Keep this repository PRIVATE: the backup contains customer data.
# Needs one repository secret: BACKUP_DATABASE_URL (your direct, non-pooled database URL).
name: DB backup
on:
  schedule: [{ cron: "0 21 * * *" }]
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pg_dump "${{ secrets.BACKUP_DATABASE_URL }}" -Fc -f backup.dump
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup.dump
          retention-days: 14
